<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f3c6d8"
    >

    <meta
        name="description"
        content="Sistema de gestão da MabijuFit"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="MabijuFit"
    >

    <title>MabijuFit</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="icon"
        type="image/png"
        href="assets/icons/icon-192.png"
    >

    <link
        rel="apple-touch-icon"
        href="assets/icons/icon-192.png"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div id="app">

        <header class="app-header">
            <div class="brand">
                <span class="brand-name">MabijuFit</span>
                <span class="brand-subtitle">
                    Gestão da sua loja
                </span>
            </div>
        </header>


        <main class="app-content">

            <section class="welcome-card">

                <div class="welcome-logo">
                    M
                </div>

                <h1>
                    Bem-vinda à MabijuFit
                </h1>

                <p>
                    Seu sistema de gestão
                    está sendo preparado.
                </p>

                <button
                    type="button"
                    id="startButton"
                    class="primary-button"
                >
                    Começar
                </button>

            </section>

        </main>

    </div>


    <script src="js/app.js"></script>

</body>
</html>
