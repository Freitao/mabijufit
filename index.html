<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f3c6d8"
    >

    <meta
        name="description"
        content="Sistema de gestão da MabijuFit"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="MabijuFit"
    >

    <title>MabijuFit</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="icon"
        type="image/png"
        href="assets/icons/icon-192.png"
    >

    <link
        rel="apple-touch-icon"
        href="assets/icons/icon-192.png"
    >

    <link
        rel="stylesheet"
        href="css/style.css?v=3"
    >

</head>


<body>

    <div id="app">


        <!-- =================================================
             TELA DE LOGIN
             ================================================= -->

        <main
            id="loginScreen"
            class="login-page"
        >

            <section class="login-card">

                <div class="login-logo">

                    <img
                        src="assets/icons/icon-192.png"
                        alt="MabijuFit"
                    >

                </div>


                <div class="login-header">

                    <h1>
                        MabijuFit
                    </h1>

                    <p>
                        Gestão da sua loja
                    </p>

                </div>


                <form
                    id="loginForm"
                    class="login-form"
                >

                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        id="loginButton"
                        class="primary-button"
                    >
                        Entrar
                    </button>


                    <p
                        id="loginMessage"
                        class="login-message"
                        aria-live="polite"
                    ></p>

                </form>


                <div class="login-footer">

                    <span>
                        MabijuFit
                    </span>

                    <span>
                        Gestão inteligente
                    </span>

                </div>

            </section>

        </main>



        <!-- =================================================
             APLICAÇÃO
             ================================================= -->

        <main
            id="appScreen"
            class="app-screen"
            hidden
        >


            <!-- HEADER -->

            <header class="dashboard-header">

                <div>

                    <span class="dashboard-greeting">
                        Olá,
                    </span>

                    <h1 id="userName">
                        MabijuFit
                    </h1>

                </div>


                <button
                    type="button"
                    id="logoutButton"
                    class="icon-button"
                    aria-label="Sair"
                >
                    Sair
                </button>

            </header>



            <!-- CONTEÚDO -->

            <section class="dashboard-content">


                <div class="dashboard-title">

                    <span>
                        Visão geral
                    </span>

                    <h2>
                        Resumo da loja
                    </h2>

                </div>



                <!-- CARDS -->

                <div class="metrics-grid">


                    <article class="metric-card">

                        <span class="metric-label">
                            Vendas
                        </span>

                        <strong
                            id="metricSales"
                            class="metric-value"
                        >
                            R$ 0,00
                        </strong>

                        <small>
                            Hoje
                        </small>

                    </article>



                    <article class="metric-card">

                        <span class="metric-label">
                            Pedidos
                        </span>

                        <strong
                            id="metricOrders"
                            class="metric-value"
                        >
                            0
                        </strong>

                        <small>
                            Hoje
                        </small>

                    </article>



                    <article class="metric-card">

                        <span class="metric-label">
                            Estoque baixo
                        </span>

                        <strong
                            id="metricLowStock"
                            class="metric-value"
                        >
                            0
                        </strong>

                        <small>
                            Produtos
                        </small>

                    </article>



                    <article class="metric-card">

                        <span class="metric-label">
                            Despesas
                        </span>

                        <strong
                            id="metricExpenses"
                            class="metric-value"
                        >
                            R$ 0,00
                        </strong>

                        <small>
                            Hoje
                        </small>

                    </article>


                </div>



                <!-- ACESSOS RÁPIDOS -->

                <section class="dashboard-section">

                    <div class="section-heading">

                        <h2>
                            Acessos rápidos
                        </h2>

                    </div>


                    <div class="quick-actions">


                        <button
                            type="button"
                            class="quick-action"
                            data-section="products"
                        >

                            <span class="quick-action-icon">
                                P
                            </span>

                            <span>
                                Produtos
                            </span>

                        </button>



                        <button
                            type="button"
                            class="quick-action"
                            data-section="stock"
                        >

                            <span class="quick-action-icon">
                                E
                            </span>

                            <span>
                                Estoque
                            </span>

                        </button>



                        <button
                            type="button"
                            class="quick-action"
                            data-section="sales"
                        >

                            <span class="quick-action-icon">
                                V
                            </span>

                            <span>
                                Vendas
                            </span>

                        </button>



                        <button
                            type="button"
                            class="quick-action"
                            data-section="finance"
                        >

                            <span class="quick-action-icon">
                                F
                            </span>

                            <span>
                                Financeiro
                            </span>

                        </button>


                    </div>

                </section>



                <!-- ATIVIDADE -->

                <section class="dashboard-section">

                    <div class="section-heading">

                        <h2>
                            Atividade recente
                        </h2>

                    </div>


                    <div
                        id="recentActivity"
                        class="empty-state"
                    >

                        <div class="empty-state-icon">
                            M
                        </div>

                        <strong>
                            Nenhuma atividade ainda
                        </strong>

                        <p>
                            As vendas e movimentações
                            aparecerão aqui.
                        </p>

                    </div>

                </section>


            </section>



            <!-- NAVEGAÇÃO INFERIOR -->

            <nav class="bottom-navigation">


                <button
                    type="button"
                    class="nav-item active"
                    data-section="home"
                >

                    <span class="nav-icon">
                        I
                    </span>

                    <span>
                        Início
                    </span>

                </button>



                <button
                    type="button"
                    class="nav-item"
                    data-section="products"
                >

                    <span class="nav-icon">
                        P
                    </span>

                    <span>
                        Produtos
                    </span>

                </button>



                <button
                    type="button"
                    class="nav-item"
                    data-section="stock"
                >

                    <span class="nav-icon">
                        E
                    </span>

                    <span>
                        Estoque
                    </span>

                </button>



                <button
                    type="button"
                    class="nav-item"
                    data-section="sales"
                >

                    <span class="nav-icon">
                        V
                    </span>

                    <span>
                        Vendas
                    </span>

                </button>



                <button
                    type="button"
                    class="nav-item"
                    data-section="finance"
                >

                    <span class="nav-icon">
                        F
                    </span>

                    <span>
                        Financeiro
                    </span>

                </button>


            </nav>


        </main>

    </div>



    <!-- =====================================================
         SCRIPTS
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
