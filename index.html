<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f3c6d8"
    >

    <meta
        name="description"
        content="Sistema de gestão da MabijuFit"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="MabijuFit"
    >

    <title>MabijuFit</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="icon"
        type="image/png"
        href="assets/icons/icon-192.png"
    >

    <link
        rel="apple-touch-icon"
        href="assets/icons/icon-192.png"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <div id="app">

        <main class="login-page">

            <section class="login-card">

                <div class="login-logo">
                    <img
                        src="assets/icons/icon-192.png"
                        alt="MabijuFit"
                    >
                </div>


                <div class="login-header">

                    <h1>
                        MabijuFit
                    </h1>

                    <p>
                        Gestão da sua loja
                    </p>

                </div>


                <form
                    id="loginForm"
                    class="login-form"
                >

                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        id="loginButton"
                        class="primary-button"
                    >
                        Entrar
                    </button>


                    <p
                        id="loginMessage"
                        class="login-message"
                        aria-live="polite"
                    ></p>

                </form>


                <div class="login-footer">

                    <span>
                        MabijuFit
                    </span>

                    <span>
                        Gestão inteligente
                    </span>

                </div>

            </section>

        </main>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
